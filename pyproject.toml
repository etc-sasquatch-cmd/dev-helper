[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "focusdeck"
version = "0.1.0"
description = "Personal desktop widget: Pomodoro, music, study tracking, and AI reviewers."
requires-python = ">=3.13"
dependencies = [
    "nicegui",
    "pywebview",
    "pydantic",
    "httpx",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focusdeck = ["db/migrations/*.sql", "music/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
